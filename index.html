<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mátrix Labor — Vezénylési Rendszer</title>
    <style>
        :root {
            --bg-color: #161b22;
            --panel-bg: #21262d;
            --text-color: #f0f6fc;
            --border-color: #30363d;
            --green: #238636;
            --red: #da3633;
            --yellow-led: #ffd700;
            --purple: #8957e5;
            --yellow: #9e6a03;
            --blue: #1f6feb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 6px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 2px;
            font-size: 1.05rem;
        }
        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: #8b949e;
            margin-bottom: 8px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            background: var(--panel-bg);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        select, input, button {
            background: #30363d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        button {
            background: var(--blue);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #388bfd; }
        .btn-save {
            background: var(--green) !important;
            color: white !important;
        }
        .btn-save:hover { background: #2ea043 !important; }
        .btn-word {
            background: #8957e5 !important;
            color: white !important;
        }
        .btn-word:hover { background: #9c6ffe !important; }
        .palette {
            display: flex;
            gap: 6px;
            background: var(--panel-bg);
            padding: 9px 12px; /* Megemelt magasság a Gyorskitöltés sávnak */
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }
        .palette span { font-weight: bold; color: #8b949e; margin-right: 4px; }
        .p-btn { padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .btn-np { background: var(--green); color: white; }
        .btn-ep { background: var(--red); color: white; }
        .btn-nep { background: var(--purple); color: white; }
        .btn-szb { background: var(--yellow); color: white; }
        .btn-szab { background: var(--blue); color: white; }
        .btn-clear { background: #30363d; color: #c9d1d9; border: 1px solid var(--border-color); }
        .table-container {
            overflow: auto;
            background: var(--panel-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-height: 48vh;
            margin-bottom: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.65rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 3px 1px;
            white-space: nowrap;
        }
        th {
            position: sticky;
            z-index: 2;
        }
        .week-row th {
            top: 0;
            background-color: #21262d !important;
            color: #58a6ff;
            font-weight: bold;
            z-index: 4;
            padding: 6px 2px;
        }
        .req-row th {
            top: 24px;
            background-color: #161b22 !important;
            z-index: 4;
            padding: 8px 4px;
        }
        .day-row th {
            top: 58px;
            z-index: 4;
            padding: 8px 4px;
        }
        .name-col {
            text-align: left;
            font-weight: bold;
            position: sticky;
            left: 0;
            background-color: #21262d !important;
            z-index: 3;
            min-width: 165px;
            max-width: 165px;
            font-size: 0.9rem;
        }
        th.name-col {
            background-color: #30363d !important;
            z-index: 5 !important;
            font-size: 0.85rem;
        }
        .hours-col {
            min-width: 45px;
            max-width: 45px;
            width: 45px;
            font-size: 0.8rem !important;
        }
        .total-row td {
            background-color: #1f2937 !important;
            color: #58a6ff !important;
            font-weight: bold;
        }
        .week-separator {
            border-left: 2px solid #58a6ff !important;
        }
        td.cell-default, td[class*="pos-"] {
            font-size: 0.8rem !important;
            font-weight: bold !important;
        }
        td.cell-default {
            background-color: #ffffff;
            color: #24292e;
            cursor: pointer;
            min-width: 21px;
        }
        td.cell-locked {
            background-color: #1f6feb !important;
            color: white !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            font-weight: bold;
            font-size: 0.75rem !important;
        }
        .pos-np { background-color: #238636 !important; color: white !important; cursor: pointer; }
        .pos-ep { background-color: #da3633 !important; color: white !important; cursor: pointer; }
        .pos-nep { background-color: #8957e5 !important; color: white !important; cursor: pointer; }
        .pos-szb { background-color: #9e6a03 !important; color: white !important; cursor: pointer; }
        .pos-szab { background-color: #1f6feb !important; color: white !important; cursor: pointer; }
        
        td.selected-cell {
            outline: 2px solid #ff7b72;
            outline-offset: -2px;
        }
        .panels-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .top-panels-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        @media (max-width: 900px) {
            .top-panels-row { grid-template-columns: 1fr; }
        }
        .audit-panel, .holiday-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.75rem;
        }
        .vacation-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.75rem;
            width: 100%;
            box-sizing: border-box;
        }
        .vacation-panel h3 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .vacation-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        @media (max-width: 1200px) {
            .vacation-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 800px) {
            .vacation-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .vacation-card {
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 6px;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .vacation-card-header {
            font-weight: bold;
            color: #f0f6fc;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vacation-card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b949e;
            font-size: 0.65rem;
        }
        .alert-badge {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.6rem;
        }
        .alert-ok { background: var(--green); color: white; }
        .alert-error { background: var(--red); color: white; }
        .alert-warning { background: var(--yellow-led); color: #000; }
        @keyframes blinkLed {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            50% { opacity: 0.15; transform: scale(1.5); filter: brightness(2); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }
        .led-ok {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #2ea043;
            border-radius: 50%;
            margin-left: 2px;
            box-shadow: 0 0 5px #2ea043;
        }
        .led-alert {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-left: 2px;
            animation: blinkLed 0.5s infinite;
            box-shadow: 0 0 8px #ff3b30;
        }
        .led-warning {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #ffd700;
            border-radius: 50%;
            margin-left: 2px;
            animation: blinkLed 0.5s infinite;
            box-shadow: 0 0 8px #ffd700;
        }
        .day-saturday-header {
            background-color: #1f4f29 !important;
            color: #56d364 !important;
            border-bottom: 2px solid var(--green) !important;
        }
        .day-sunday-holiday-header {
            background-color: #672528 !important;
            color: #ff8182 !important;
            border-bottom: 2px solid var(--red) !important;
        }
        .day-normal-header {
            background-color: #30363d !important;
            color: #f0f6fc !important;
        }
    </style>
</head>
<body id="mainBody">
    <h1>Mátrix Labor — Vezénylési Rendszer</h1>
    <div class="subtitle">Univerzális Modul & PC Word Export</div>
    <div class="controls">
        <div style="display: flex; gap: 6px; align-items: center;">
            <div>
                <label for="yearSelect">Év:</label>
                <select id="yearSelect" onchange="generateCalendar()">
                    <script>
                        for(let y = 2026; y <= 2035; y++) {
                            document.write(`<option value="${y}" ${y === 2027 ? 'selected' : ''}>${y}</option>`);
                        }
                    </script>
                </select>
            </div>
            <div>
                <label for="monthSelect">Hónap:</label>
                <select id="monthSelect" onchange="generateCalendar()">
                    <option value="0">Január</option>
                    <option value="1">Február</option>
                    <option value="2">Március</option>
                    <option value="3">Április</option>
                    <option value="4">Május</option>
                    <option value="5">Június</option>
                    <option value="6">Július</option>
                    <option value="7">Augusztus</option>
                    <option value="8">Szeptember</option>
                    <option value="9">Október</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-save" onclick="manualSave()">💾 Adatok Mentése</button>
            <button class="btn-word" onclick="downloadWordFile()">📥 Word Fájl Mentése</button>
        </div>
    </div>
    <div class="palette">
        <span>Gyorskitöltés:</span>
        <button class="p-btn btn-np" onclick="applyServiceWithPos('Np', 'pos-np', 'np')">Nappal:</button>
        <select id="npNum" style="padding: 2px 4px; font-size:0.75rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-ep" onclick="applyServiceWithPos('Ép', 'pos-ep', 'ep')">Éjjel:</button>
        <select id="epNum" style="padding: 2px 4px; font-size:0.75rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-nep" onclick="applyServiceWithPos('NÉp', 'pos-nep', 'nep')">24h:</button>
        <select id="nepNum" style="padding: 2px 4px; font-size:0.75rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-szb" onclick="applyService('SZB', 'pos-szb', 'szb')">Szabadság (SZB)</button>
        <button class="p-btn btn-szab" onclick="applyService('SZ', 'pos-szab', 'szab')">Szabadnap (SZ)</button>
        <button class="p-btn btn-clear" onclick="applyService('', 'cell-default', 'clear')">Törlés</button>
    </div>
    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="panels-wrapper">
        <div class="vacation-panel">
            <h3>🌴 Éves Göngyölített Szabadságkezelő (Globális Névsor)</h3>
            <div id="vacationReport" class="vacation-grid">Szabadságok számítása...</div>
        </div>
        <div class="top-panels-row">
            <div class="audit-panel">
                <h3>🔍 Létszám Figyelőmotor</h3>
                <div id="auditReport" style="font-size:0.7rem;">Elemzés...</div>
            </div>
            <div class="holiday-panel">
                <h3>🎉 Havi Ünnepnapok Számláló</h3>
                <div id="holidayReport" style="font-size:0.7rem;">Ünnepnapok ellenőrzése...</div>
            </div>
        </div>
    </div>
    <script>
        const defaultGuardsTemplate = Array.from({length: 20}, (_, i) => `Őr ${i + 1}`);
        const dayNames = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
        let activeCell = null;

        function getGlobalGuards() {
            let saved = JSON.parse(localStorage.getItem('matrix_global_guards_v2'));
            if(!saved || saved.length !== 20) {
                return [...defaultGuardsTemplate];
            }
            return saved;
        }

        function isHoliday(date) {
            let m = date.getMonth() + 1;
            let d = date.getDate();
            const fixedHolidays = [
                "1-1", "3-15", "5-1", "8-20", "10-23", "11-1", "12-25", "12-26"
            ];
            return fixedHolidays.includes(`${m}-${d}`);
        }
        function getISOWeekNumber(d) {
            let date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            let dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            let yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }
        function getDateKey(d) {
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        function generateCalendar() {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            if(!yearSelect || !monthSelect) return;
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            let days = [];
            let pYear = year;
            let pMonth = month - 1;
            if(pMonth < 0) {
                pMonth = 11;
                pYear = year - 1;
            }
            let prevMonthLastDate = new Date(pYear, pMonth + 1, 0).getDate();
            for(let i = 2; i >= 0; i--) {
                let dayNum = prevMonthLastDate - i;
                let d = new Date(pYear, pMonth, dayNum);
                days.push({ date: d, isExtra: true });
            }
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                let d = new Date(year, month, i);
                days.push({ date: d, isExtra: false });
            }
            let weekRowHtml = '<tr class="week-row"><th class="name-col">Hét száma</th>';
            let reqRowHtml = '<tr class="req-row"><th class="name-col">Elvárt Létszám</th>';
            let dayRowHtml = '<tr class="day-row"><th class="name-col">Név / Dátum</th>';
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            let holidayCount = 0;
            days.forEach((item, index) => {
                let d = item.date;
                let dayIndex = d.getDay();
                let dayLetter = dayNames[dayIndex];
                let weekNum = getISOWeekNumber(d);
                let dateStr = `${d.getMonth()+1}.${d.getDate()}.`;
                let dKey = getDateKey(d);
                
                let isMonday = (dayIndex === 1);
                let sepClass = (isMonday && index > 0) ? 'week-separator' : '';
                weekRowHtml += `<th class="${sepClass}">${weekNum}.hét</th>`;
                
                if (item.isExtra) {
                    reqRowHtml += `<th class="${sepClass}" style="background:#1f6feb;">-</th>`;
                } else {
                    let reqVal = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                    reqRowHtml += `<th class="${sepClass}"><input type="number" min="0" max="20" value="${reqVal}" data-date="${dKey}" onchange="updateRequired(this)" style="width:32px; height:32px; text-align:center; background:#21262d; color:#58a6ff; border:1px solid var(--border-color); border-radius:4px; font-weight:bold; font-size:0.85rem; padding:2px;"></th>`;
                }
                let headerClass = "day-normal-header";
                if (isHoliday(d)) {
                    headerClass = "day-sunday-holiday-header";
                    if (!item.isExtra) holidayCount++;
                } else if (dayIndex === 6) {
                    headerClass = "day-saturday-header";
                } else if (dayIndex === 0) {
                    headerClass = "day-sunday-holiday-header";
                }
                let extraHeaderStyle = item.isExtra && headerClass === "day-normal-header" ? 'background:#1f6feb; color:white;' : '';
                let ledHtml = item.isExtra ? '' : `<span id="led-${dKey}"><span class="led-ok" title="Létszám rendben"></span></span>`;
                dayRowHtml += `<th id="th-day-${dKey}" class="${sepClass} ${headerClass}" style="${extraHeaderStyle}" data-holiday="${isHoliday(d) ? '1' : '0'}" data-saturday="${dayIndex === 6 ? '1' : '0'}" data-sunday="${dayIndex === 0 ? '1' : '0'}">${dateStr}<br><small style="font-size:0.6rem; font-weight:bold;">${dayLetter}</small>${ledHtml}</th>`;
            });
            weekRowHtml += '<th class="hours-col">Óra</th></tr>';
            reqRowHtml += '<th class="hours-col">Cél</th></tr>';
            dayRowHtml += '<th class="hours-col">Keret</th></tr>';
            document.getElementById('tableHeader').innerHTML = weekRowHtml + reqRowHtml + dayRowHtml;
            document.getElementById('holidayReport').innerHTML = `<b>Ebben a hónapban:</b> <span style="color:#ff8182; font-weight:bold; font-size:0.8rem;">${holidayCount} db</span> hivatalos ünnepnap esik.`;
            
            let currentGuards = getGlobalGuards();
            let prevMonthSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${pYear}_${pMonth}`)) || {};
            let savedData = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${month}`)) || {};
            let tbodyHtml = '';
            currentGuards.forEach((guardName, gIndex) => {
                tbodyHtml += `<tr>`;
                tbodyHtml += `<td class="name-col"><input type="text" id="guard-name-${gIndex}" value="${guardName}" placeholder="Őr ${gIndex+1}" style="width:165px; background:transparent; border:none; color:inherit; font-weight:bold; font-size:0.9rem;" oninput="autoSave()"></td>`;
                
                days.forEach((item, dIndex) => {
                    let d = item.date;
                    let dayIndex = d.getDay();
                    let dKey = getDateKey(d);
                    let cellKey = `g_${gIndex}_d_${dIndex}`;
                    let globalKey = `global_cell_${dKey}_g_${gIndex}`;
                    
                    let cellInfo = null;
                    if (item.isExtra) {
                        let prevD = item.date;
                        let prevDKey = getDateKey(prevD);
                        let prevGlobalKey = `global_cell_${prevDKey}_g_${gIndex}`;
                        let prevCellData = JSON.parse(localStorage.getItem(prevGlobalKey));
                        if (prevCellData && prevCellData.text) {
                            cellInfo = { text: prevCellData.text, className: prevCellData.className, type: prevCellData.type };
                        } else {
                            let prevCellKey = `g_${gIndex}_d_${prevMonthLastDate - 3 + dIndex}`;
                            let oldData = prevMonthSchedule[prevCellKey];
                            if (oldData && oldData.text) {
                                cellInfo = { text: oldData.text, className: oldData.className, type: oldData.type };
                            } else {
                                cellInfo = { text: '', className: 'cell-locked', type: 'locked' };
                            }
                        }
                    } else {
                        cellInfo = JSON.parse(localStorage.getItem(globalKey)) || savedData[cellKey];
                        if (!cellInfo) {
                            cellInfo = { text: '', className: 'cell-default', type: 'empty' };
                        }
                    }
                    
                    let isMonday = (dayIndex === 1);
                    let prevWeekCheck = (isMonday && dIndex > 0) ? 'week-separator' : '';
                    
                    if (item.isExtra) {
                        tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}">${cellInfo.text || ''}</td>`;
                    } else {
                        tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}" onclick="selectCell(this)" data-type="${cellInfo.type}" data-key="${cellKey}" data-date="${dKey}" data-guard="${gIndex}">${cellInfo.text}</td>`;
                    }
                });
                tbodyHtml += `<td id="total-hours-${gIndex}" class="hours-col" style="font-weight: bold; color: #58a6ff;">0h</td>`;
                tbodyHtml += `</tr>`;
            });
            tbodyHtml += `<tr class="total-row">`;
            tbodyHtml += `<td class="name-col" style="background:#1f2937 !important; color:#58a6ff;">Havi Összesítő</td>`;
            days.forEach((item, dIndex) => {
                let d = item.date;
                let dayIndex = d.getDay();
                let isMonday = (dayIndex === 1);
                let prevWeekCheck = (isMonday && dIndex > 0) ? 'week-separator' : '';
                tbodyHtml += `<td id="col-total-${dIndex}" class="${prevWeekCheck}">0h</td>`;
            });
            tbodyHtml += `<td id="grand-total-hours" class="hours-col" style="color:#58a6ff;">0h</td>`;
            tbodyHtml += `</tr>`;
            document.getElementById('tableBody').innerHTML = tbodyHtml;
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach(row => {
                calculateRowHours(row);
            });
            calculateColumnTotals(days);
            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }
        function updateRequired(input) {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            let dKey = input.dataset.date;
            
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            savedRequired[dKey] = parseInt(input.value) || 0;
            localStorage.setItem(`matrix_required_${year}_${month}`, JSON.stringify(savedRequired));
            generateCalendar();
        }
        function selectCell(cell) {
            if(cell.classList.contains('cell-locked') && cell.innerText.trim() !== '') return;
            if(activeCell) activeCell.classList.remove('selected-cell');
            activeCell = cell;
            activeCell.classList.add('selected-cell');
        }
        function applyServiceWithPos(prefix, className, type) {
            let numId = type === 'np' ? 'npNum' : (type === 'ep' ? 'epNum' : 'nepNum');
            let numVal = document.getElementById(numId).value;
            applyService(prefix + numVal, className, type);
        }
        function applyService(text, className, type) {
            if(!activeCell || activeCell.classList.contains('cell-locked')) {
                alert('⚠️ Először kattints rá egy szerkeszthető cellára a tárgyhónapban!');
                return;
            }
            let prevCell = activeCell.previousElementSibling;
            if(prevCell && prevCell.dataset) {
                let prevType = prevCell.dataset.type;
                if(type === 'np' && (prevType === 'ep' || prevType === 'nep')) {
                    alert('⚠️ Biztonsági szabályzat: Éjszakai vagy 24 órás szolgálat után nem lehet közvetlenül Nappal!');
                    return;
                }
            }
            let hasSeparator = activeCell.classList.contains('week-separator') ? 'week-separator' : '';
            activeCell.className = className + ' ' + hasSeparator + ' selected-cell';
            activeCell.innerText = text;
            activeCell.dataset.type = type;
            let dKey = activeCell.dataset.date;
            let gIndex = activeCell.dataset.guard;
            if(dKey && gIndex !== undefined) {
                let cellDataToSave = { text: text, className: className, type: type };
                localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellDataToSave));
            }
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            let days = [];
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                days.push({ date: new Date(year, month, i) });
            }
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach(row => {
                calculateRowHours(row);
            });
            calculateColumnTotals(days);
            autoSave();
            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }
        function calculateRowHours(row) {
            let cells = row.querySelectorAll('td');
            let totalHours = 0;
            for(let i = 1; i < cells.length - 1; i++) {
                let type = cells[i].dataset.type;
                if(type === 'np' || type === 'ep' || type === 'szb') {
                    totalHours += 12;
                } else if(type === 'nep') {
                    totalHours += 24;
                }
            }
            let hoursCell = cells[cells.length - 1];
            hoursCell.innerHTML = `<b>${totalHours}h</b>`;
        }
        function calculateColumnTotals(days) {
            let colCount = days.length;
            let colTotals = new Array(colCount).fill(0);
            let grandTotal = 0;
            let rows = document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)');
            rows.forEach(row => {
                let cells = row.querySelectorAll('td');
                for(let i = 1; i <= colCount; i++) {
                    let type = cells[i].dataset.type;
                    let h = 0;
                    if(type === 'np' || type === 'ep' || type === 'szb') h = 12;
                    else if(type === 'nep') h = 24;
                    
                    colTotals[i - 1] += h;
                }
            });
            for(let i = 0; i < colCount; i++) {
                let colCell = document.getElementById(`col-total-${i}`);
                if(colCell) {
                    colCell.innerText = colTotals[i] > 0 ? colTotals[i] + 'h' : '0h';
                }
            }
            rows.forEach(row => {
                let cells = row.querySelectorAll('td');
                let lastCell = cells[cells.length - 1];
                let val = parseInt(lastCell.innerText) || 0;
                grandTotal += val;
            });
            let grandCell = document.getElementById('grand-total-hours');
            if(grandCell) {
                grandCell.innerHTML = `<b>${grandTotal}h</b>`;
            }
        }
        function updateVacationBase(gIndex, input) {
            let val = parseInt(input.value) || 0;
            localStorage.setItem(`vacation_base_${gIndex}`, val);
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            runVacationEngine(year, month);
        }
        function runVacationEngine(year, month) {
            let currentGuards = getGlobalGuards();
            let gridHtml = '';
            
            currentGuards.forEach((guardName, gIndex) => {
                if(!guardName) guardName = `Őr ${gIndex+1}`;
                
                let baseKey = `vacation_base_${gIndex}`;
                let baseVal = localStorage.getItem(baseKey) !== null ? parseInt(localStorage.getItem(baseKey)) : 30;
                let totalUsedUntilNow = 0;
                for(let m = 0; m <= month; m++) {
                    let mDays = new Date(year, m + 1, 0).getDate();
                    let mSavedSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${m}`)) || {};
                    
                    for(let d = 0; d < mDays; d++) {
                        let cellKey = `g_${gIndex}_d_${d}`;
                        let dObj = new Date(year, m, d + 1);
                        let dKey = getDateKey(dObj);
                        let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`)) || mSavedSchedule[cellKey];
                        
                        if(globalData && globalData.type === 'szb') {
                            totalUsedUntilNow++;
                        }
                    }
                }
                let remaining = baseVal - totalUsedUntilNow;
                gridHtml += `
                    <div class="vacation-card">
                        <div class="vacation-card-header">${guardName}</div>
                        <div class="vacation-card-body">
                            <span>Alap: <input type="number" value="${baseVal}" min="0" max="100" style="width:32px; text-align:center; background:#161b22; color:#58a6ff; border:1px solid var(--border-color); border-radius:3px; font-weight:bold; font-size:0.65rem;" onchange="updateVacationBase(${gIndex}, this)"></span>
                            <span>Felh: <b style="color:var(--yellow);">${totalUsedUntilNow}</b></span>
                            <span>Mar: <b style="color:var(--blue);">${remaining}</b></span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('vacationReport').innerHTML = gridHtml;
        }
        function runAuditEngine(days, year, month) {
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            let savedSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${month}`)) || {};
            let deficitsCount = 0;
            let surplusesCount = 0;
            let currentGuards = getGlobalGuards();
            
            days.forEach((item, dIndex) => {
                if (item.isExtra) return;
                let dKey = getDateKey(item.date);
                let requiredCount = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                
                let actualCount = 0;
                currentGuards.forEach((_, gIndex) => {
                    let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`));
                    let cellKey = `g_${gIndex}_d_${dIndex}`;
                    let fallbackData = savedSchedule[cellKey];
                    let type = (globalData && globalData.type) ? globalData.type : (fallbackData ? fallbackData.type : null);
                    
                    if (type && (type === 'np' || type === 'ep' || type === 'nep')) {
                        actualCount++;
                    }
                });
                let ledSpan = document.getElementById(`led-${dKey}`);
                
                let today = new Date();
                today.setHours(0,0,0,0);
                let isPastOrToday = item.date <= today;

                if (ledSpan) {
                    if (actualCount < requiredCount && (actualCount > 0 || isPastOrToday)) {
                        ledSpan.innerHTML = `<span class="led-alert" title="Hiány: ${actualCount}/${requiredCount}"></span>`;
                        deficitsCount++;
                    } else if (actualCount > requiredCount) {
                        ledSpan.innerHTML = `<span class="led-warning" title="Többlet: ${actualCount}/${requiredCount}"></span>`;
                        surplusesCount++;
                    } else {
                        ledSpan.innerHTML = `<span class="led-ok" title="Létszám rendben: ${actualCount}/${requiredCount}"></span>`;
                    }
                }
            });
            let reportHtml = '';
            if (deficitsCount === 0 && surplusesCount === 0) {
                reportHtml = `<span class="alert-badge alert-ok">MINDEN PONTOS</span> A létszám keret tökéletesen teljesül!`;
            } else {
                let parts = [];
                if (deficitsCount > 0) parts.push(`<span class="alert-badge alert-error">${deficitsCount} hiány</span>`);
                if (surplusesCount > 0) parts.push(`<span class="alert-badge alert-warning" style="background:#ffd700; color:#000;">${surplusesCount} többlet</span>`);
                reportHtml = parts.join(' | ');
            }
            document.getElementById('auditReport').innerHTML = reportHtml;
        }
        function autoSave() {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            
            let currentGuards = [];
            for(let i = 0; i < 20; i++) {
                let nameInput = document.getElementById(`guard-name-${i}`);
                currentGuards.push(nameInput ? nameInput.value : `Őr ${i+1}`);
            }
            localStorage.setItem('matrix_global_guards_v2', JSON.stringify(currentGuards));

            let dataToSave = {};
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach((row, gIndex) => {
                row.querySelectorAll('td').forEach((cell, cIndex) => {
                    if(cIndex > 0 && cIndex < row.querySelectorAll('td').length - 1) {
                        let cellKey = cell.dataset.key;
                        let dKey = cell.dataset.date;
                        if(cellKey && !cell.classList.contains('cell-locked')) {
                            let cellInfo = {
                                text: cell.innerText,
                                className: cell.className.replace('selected-cell', '').trim(),
                                type: cell.type || cell.dataset.type
                            };
                            dataToSave[cellKey] = cellInfo;
                            if(dKey) {
                                localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellInfo));
                            }
                        }
                    }
                });
            });
            localStorage.setItem(`matrix_schedule_${year}_${month}`, JSON.stringify(dataToSave));
            runVacationEngine(year, month);
        }
        function manualSave() {
            autoSave();
            alert('💾 A Mátrix Labor adatai és a tiszta névsor sikeresen mentve!');
        }
        function downloadWordFile() {
            let rows = document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)');
            rows.forEach((row, gIndex) => {
                let nameInput = row.querySelector(`#guard-name-${gIndex}`);
                let nameCell = row.querySelector('.name-col');
                if(nameInput && nameCell) {
                    nameCell.innerHTML = `<b>${nameInput.value}</b>`;
                }
            });

            let currentGuards = getGlobalGuards();
            let year = parseInt(document.getElementById('yearSelect').value);
            let month = parseInt(document.getElementById('monthSelect').value);
            
            let cleanVacationHtml = '<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">';
            currentGuards.forEach((guardName, gIndex) => {
                if(!guardName) guardName = `Őr ${gIndex+1}`;
                let baseVal = localStorage.getItem(`vacation_base_${gIndex}`) !== null ? parseInt(localStorage.getItem(`vacation_base_${gIndex}`)) : 30;
                let totalUsedUntilNow = 0;
                for(let m = 0; m <= month; m++) {
                    let mDays = new Date(year, m + 1, 0).getDate();
                    let mSavedSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${m}`)) || {};
                    for(let d = 0; d < mDays; d++) {
                        let cellKey = `g_${gIndex}_d_${d}`;
                        let dObj = new Date(year, m, d + 1);
                        let dKey = getDateKey(dObj);
                        let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`)) || mSavedSchedule[cellKey];
                        if(globalData && globalData.type === 'szb') {
                            totalUsedUntilNow++;
                        }
                    }
                }
                let remaining = baseVal - totalUsedUntilNow;
                cleanVacationHtml += `
                    <div style="border: 1px solid #333333; border-radius: 4px; padding: 6px; font-size: 9px; background: #f9fafb; margin-bottom: 6px;">
                        <div style="font-weight: bold; border-bottom: 1px solid #cccccc; padding-bottom: 2px; margin-bottom: 3px; color: #111111;">${guardName}</div>
                        <div style="display: flex; justify-content: space-between; color: #333333;">
                            <span>Alap: <b>${baseVal}</b></span>
                            <span>Felh: <b style="color:#9e6a03;">${totalUsedUntilNow}</b></span>
                            <span>Mar: <b style="color:#1f6feb;">${remaining}</b></span>
                        </div>
                    </div>
                `;
            });
            cleanVacationHtml += '</div>';

            let tableContainerClone = document.querySelector('.table-container').cloneNode(true);
            let dayThs = tableContainerClone.querySelectorAll('.day-row th');
            dayThs.forEach(th => {
                let isSat = th.dataset.saturday === '1';
                let isHol = th.dataset.holiday === '1' || th.classList.contains('day-sunday-holiday-header');
                let isSun = th.dataset.sunday === '1';
                
                if (isHol || isSun) {
                    th.style.backgroundColor = '#fee2e2';
                    th.setAttribute('style', th.getAttribute('style') + '; background-color: #fee2e2 !important; mso-shading: #fee2e2; color: #991b1b !important;');
                } else if (isSat) {
                    th.style.backgroundColor = '#d1fae5';
                    th.setAttribute('style', th.getAttribute('style') + '; background-color: #d1fae5 !important; mso-shading: #d1fae5; color: #065f46 !important;');
                } else {
                    th.style.backgroundColor = '#f0f4f8';
                    th.setAttribute('style', th.getAttribute('style') + '; background-color: #f0f4f8 !important; mso-shading: #f0f4f8; color: #000000 !important;');
                }
            });
            let tableHtml = tableContainerClone.innerHTML;
            let auditHtml = document.getElementById('auditReport').innerHTML;
            let holidayHtml = document.getElementById('holidayReport').innerHTML;
            
            let htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="UTF-8">
                    <title>Mátrix Labor — Hivatalos Vezénylési Jelentés</title>
                    <style>
                        @page WordSection1 {
                            size: 842.25pt 595.3pt;
                            mso-page-orientation: landscape;
                            margin: 1cm 1cm 1cm 1cm;
                        }
                        div.WordSection1 {
                            page: WordSection1;
                        }
                        body { font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff; color: #000000; margin: 10px; font-size: 10px; }
                        h1 { text-align: center; font-size: 16px; color: #1f6feb; margin-bottom: 2px; }
                        .subtitle { text-align: center; font-size: 10px; margin-bottom: 15px; color: #555555; }
                        table { width: 100%; border-collapse: collapse; text-align: center; margin-bottom: 15px; font-size: 8px; }
                        th, td { border: 1px solid #333333; padding: 4px 1px; }
                        th { background: #f0f4f8 !important; color: #000000 !important; font-weight: bold; }
                        
                        .name-col { min-width: 165px; max-width: 165px; font-size: 11px; font-weight: bold; text-align: left; }
                        .hours-col { min-width: 45px; max-width: 45px; width: 45px; font-size: 9px; font-weight: bold; }

                        .section-title { font-size: 12px; font-weight: bold; margin-top: 25px; margin-bottom: 8px; border-bottom: 2px solid #1f6feb; padding-bottom: 3px; color: #1f6feb; page-break-before: always; mso-break-type: section-break; }
                        .total-row td { background-color: #e2e8f0 !important; mso-shading: #e2e8f0; color: #000000 !important; font-weight: bold; }
                        .cell-locked { background-color: #bfdbfe !important; mso-shading: #bfdbfe; color: #1e40af !important; font-weight: bold; }
                        .pos-np { background-color: #238636 !important; mso-shading: #238636; color: white !important; font-weight: bold; }
                        .pos-ep { background-color: #da3633 !important; mso-shading: #da3633; color: white !important; font-weight: bold; }
                        .pos-nep { background-color: #8957e5 !important; mso-shading: #8957e5; color: white !important; font-weight: bold; }
                        .pos-szb { background-color: #9e6a03 !important; mso-shading: #9e6a03; color: white !important; font-weight: bold; }
                        .pos-szab { background-color: #1f6feb !important; mso-shading: #1f6feb; color: white !important; font-weight: bold; }
                        .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
                        .summary-box { border: 1px solid #333333; border-radius: 4px; padding: 8px; font-size: 10px; background: #f9fafb !important; }
                        .summary-box h3 { margin: 0 0 5px 0; font-size: 11px; color: #1f6feb; }
                    </style>
                </head>
                <body>
                    <div class="WordSection1">
                        <h1>Mátrix Labor — Hivatalos Vezénylési Jelentés</h1>
                        <div class="subtitle">Univerzális Rendszer Export</div>
                        
                        <div style="font-size: 12px; font-weight: bold; margin-top: 10px; margin-bottom: 8px; border-bottom: 2px solid #1f6feb; padding-bottom: 3px; color: #1f6feb;">1. Havi Vezénylési Táblázat</div>
                        <div>${tableHtml}</div>
                        
                        <div class="section-title">2. Éves Göngyölített Szabadságkezelő</div>
                        <div>${cleanVacationHtml}</div>
                        
                        <div class="summary-row">
                            <div class="summary-box">
                                <h3>🔍 Létszám Figyelőmotor</h3>
                                <div>${auditHtml}</div>
                            </div>
                            <div class="summary-box">
                                <h3>🎉 Havi Ünnepnapok Számláló</h3>
                                <div>${holidayHtml}</div>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;

            let blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'Matrix_Labor_Vezenyles.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            generateCalendar();
        }
        window.onload = function() {
            generateCalendar();
        };
    </script>
